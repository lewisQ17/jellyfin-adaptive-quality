[package]
name = "jelly-scripts"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of the Jellyfin admin scripts (watch-notify, cache-fix). Front door generated by rust-anything; the bash originals stay as reference."

[[bin]]
name = "jelly-scripts"
path = "src/main.rs"

[dependencies]
rustix = { version = "1", features = ["fs"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
ureq = { version = "3", default-features = false }

[workspace]
